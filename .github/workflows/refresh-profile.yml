name: Refresh organization profile assets

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_assets.py"
      - "profile/fonts/**"
      - "profile/assets/logos/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install --quiet fonttools

      - name: Regenerate SVG artwork with live GitHub numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_assets.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets profile/data
          if git diff --cached --quiet; then
            echo "profile assets already up to date"
          else
            git commit -m "chore(profile): refresh stats and repo cards ($(date -u +%Y-%m-%d))"
            git push
          fi
